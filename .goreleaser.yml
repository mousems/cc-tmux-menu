version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/cc-tmux-menu
    binary: cc-tmux-menu
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"

brews:
  - repository:
      owner: mousems
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/mousems/cc-tmux-menu"
    description: "Interactive tmux session manager with AI-powered previews for Claude Code"
    license: "MIT"
    install: |
      bin.install "cc-tmux-menu"
    test: |
      assert_match version, shell_output("#{bin}/cc-tmux-menu --version")

release:
  github:
    owner: mousems
    name: cc-tmux-menu
